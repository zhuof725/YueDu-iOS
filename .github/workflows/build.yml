name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Engine tests (规则引擎测试)
        run: |
          set -o pipefail
          xcodebuild -project YueDu.xcodeproj -scheme EngineTest -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build-test build > test-build.log 2>&1 \
            || { grep -E "error:" test-build.log | sort -u | head -80; exit 1; }
          ./build-test/Build/Products/Debug/EngineTest

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project YueDu.xcodeproj \
            -scheme YueDu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80 > errors.txt; cat errors.txt; tail -30 build.log; exit 1; }
          grep -E "\*\* BUILD" build.log
          # 必须真的有可执行文件，否则算失败
          test -f build/Build/Products/Release-iphoneos/YueDu.app/YueDu

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YueDu.app Payload/
          zip -qry YueDu-unsigned.ipa Payload
          ls -lh YueDu-unsigned.ipa
          unzip -l YueDu-unsigned.ipa
          # 必须包含主程序和 Info.plist，否则判定为空包
          unzip -l YueDu-unsigned.ipa | grep -q "Payload/YueDu.app/YueDu$" || { echo "缺少主程序，空包"; exit 1; }
          unzip -l YueDu-unsigned.ipa | grep -q "Payload/YueDu.app/Info.plist" || { echo "缺少 Info.plist"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-unsigned-ipa
          path: YueDu-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 测试版 build ${{ github.run_number }}
          files: YueDu-unsigned.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
