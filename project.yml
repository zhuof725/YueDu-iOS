name: YueDu
options:
  bundleIdPrefix: io.github.zhuof725
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.13.9
  Kanna:
    url: https://github.com/tid-kijyun/Kanna
    exactVersion: 5.3.0
targets:
  YueDu:
    type: application
    platform: iOS
    sources:
      - path: YueDu/Sources
      - path: YueDu/Resources
    dependencies:
      - package: SwiftSoup
      - package: Kanna
      - sdk: JavaScriptCore.framework
      - sdk: WebKit.framework
    info:
      path: YueDu/Info.plist
      properties:
        CFBundleDisplayName: 阅读
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.zhuof725.yuedu
            CFBundleURLSchemes:
              - yuedu
              - legado
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zhuof725.yuedu
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
  EngineTest:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/EngineTest
        excludes:
          - samples
      - path: YueDu/Sources/Engine
      - path: YueDu/Sources/Rule
      - path: YueDu/Sources/Model/Book.swift
      - path: YueDu/Sources/Model/BookSource.swift
    dependencies:
      - package: SwiftSoup
      - package: Kanna
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: minimal
